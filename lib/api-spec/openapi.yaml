openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: home-stock
    description: Account-scoped Home Stock cloud backup and sync
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /home-stock:
    get:
      operationId: getHomeStock
      tags: [home-stock]
      summary: Get the signed-in user's saved inventory
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Saved inventory, or null when this account has not synced yet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeStockResponse"
        "401":
          description: Authentication required
    put:
      operationId: saveHomeStock
      tags: [home-stock]
      summary: Save the signed-in user's inventory
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HomeStockInput"
      responses:
        "200":
          description: Saved inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeStockResponse"
        "400":
          description: Invalid inventory data
        "401":
          description: Authentication required
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    SavedStockItem:
      type: object
      additionalProperties: true
    SavedBuyListItem:
      type: object
      additionalProperties: true
    SavedStockData:
      type: object
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SavedStockItem"
        shoppingList:
          type: array
          items:
            $ref: "#/components/schemas/SavedBuyListItem"
        recentLocations:
          type: array
          items:
            type: string
        recentStores:
          type: array
          items:
            type: string
      required:
        - items
        - shoppingList
        - recentLocations
        - recentStores
    HomeStockInput:
      type: object
      additionalProperties: false
      properties:
        data:
          $ref: "#/components/schemas/SavedStockData"
      required:
        - data
    HomeStockResponse:
      type: object
      additionalProperties: false
      properties:
        data:
          oneOf:
            - $ref: "#/components/schemas/SavedStockData"
            - type: "null"
        updatedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - data
        - updatedAt

