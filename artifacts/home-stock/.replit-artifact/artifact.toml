kind = "mobile"
previewPath = "/"
title = "Home Stock"
description = "A simple household stock tracker for managing everyday supplies. Add items with minimum and restock quantities, storage locations, and store types, then complete a guided stock check that builds a grouped shopping list."
version = "1.0.0"
id = "artifacts/home-stock"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20122

[services.development]
run = "pnpm --filter @workspace/home-stock run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/home-stock", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/home-stock", "run", "serve" ]

[services.env]
PORT = "20122"
BASE_PATH = "/"
