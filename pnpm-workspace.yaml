# Only install package versions that have been public for at least a day.
# Malicious releases are usually caught and pulled within hours, so the delay
# keeps them out. Don't remove it.
minimumReleaseAge: 1440

# React Native's native build tools expect a flat node_modules folder.
nodeLinker: hoisted

# Peer dependencies are listed explicitly in package.json.
autoInstallPeers: false
strictPeerDependencies: false
